name: OSGARD release readiness

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["OSGARD frontend deploy"]
    types: [completed]
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  readiness:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    env:
      OSGARD_SOURCE_REVISION: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Verify protected LiveOps analytics dashboard
        run: npm run qa:liveops-dashboard
      - name: Validate public Business hub
        run: npm run qa:business-hub
      - name: Test PR review-only live checks and release policy
        run: npm run qa:one-pass
      - name: Check cross-surface OSGARD product contracts
        run: npm run qa:contracts
      - name: Test static asset performance budgets
        run: npm run qa:performance-budget-tests
      - name: Test build-attestation tamper resistance
        run: npm run qa:release-attestation
      - name: Verify Nginx fallback, English catalogue and route contracts
        run: node scripts/production-route-matrix-contract-smoke.mjs
      - name: Verify Games runtime minification and gzip integrity
        run: npm run qa:games-assets
      - name: Verify proof-carrying release manifest fixture
        run: npm run qa:release-manifest
      - name: Test OpenAI reviewer offline (no API call)
        run: npm run qa:ai-release-review
      - name: Verify Godot diagnostics fault contract
        run: npm run qa:null-shift-diagnostics-contract
      - name: Typecheck
        run: npm run check
      - name: Validate NULL SHIFT standalone game
        run: npm run qa:null-shift
      - name: Verify OSGARD Games portal
        run: npm run qa:games-portal
      - name: Verify Operations Pulse metrics and baseline import
        run: npm run qa:games-operations
      - name: Verify monetization scenarios, cohort forecast and experiment lab
        run: npm run qa:games-model
      - name: Verify premium Entertainment discovery, sharing and SEO
        run: npm run qa:entertainment
      - name: Verify OSGARD SELECT luxury spotlight and share-reward guardrails
        run: npm run qa:osgard-select
      - name: Verify partner inventory and enquiry form
        run: npm run qa:partners-page
      - name: Build and archive preflight
        run: npm run build && npm run preflight:frontend
      - name: Enforce production asset budgets
        run: npm run qa:performance-budget
      - name: Bind build to quality reports
        run: npm run release:attest && npm run release:verify
      - name: Verify Imperium of Time gameplay and diagnostics
        run: npm run qa:time-ui
      - name: Verify production routes after deploy or manual request
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
        env:
          OSGARD_BASE_URL: https://osgard.world
          OSGARD_EXPECTED_BUILD: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: npm run qa:production-routes
      - name: Probe authenticated production API when configured
        env:
          OSGARD_PRODUCTION_API_BASE: ${{ secrets.OSGARD_PRODUCTION_API_BASE }}
          OSGARD_PRODUCTION_BEARER_TOKEN: ${{ secrets.OSGARD_PRODUCTION_BEARER_TOKEN }}
        run: npm run qa:production-api
      - name: Upload readiness report
        uses: actions/upload-artifact@v4
        with:
          name: osgard-release-readiness
          path: |
            release-manifest.json
            production-route-matrix.json
            osgard-contract-audit.json
            osgard-performance-budget.json
            release-attestation.json
