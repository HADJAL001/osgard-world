name: OSGARD AI release review (manual, opt-in)

on:
  workflow_dispatch:
    inputs:
      use_openai:
        description: "Explicitly send sanitized release summaries to the OpenAI API (may incur API charges)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: osgard-ai-release-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review:
    if: ${{ inputs.use_openai }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6-sol' }}
      OSGARD_BASE_URL: https://osgard.world
    steps:
      - name: Check out the exact requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run contract gate and preserve blocked evidence
        continue-on-error: true
        run: |
          set +e
          npm run qa:contracts > /tmp/osgard-contract-audit.log 2>&1
          code=$?
          echo "Contract audit exit code: $code"
          if [ ! -s osgard-contract-audit.json ]; then
            node -e "require('node:fs').writeFileSync('osgard-contract-audit.json', JSON.stringify({schema:'osgard.contract-integrity.v1',status:'blocked',summary:{checks:1,passed:0,failed:1,warnings:0},contract:{sha256:'0'.repeat(64)},checks:[{id:'contract-audit',title:'Contract audit did not produce a report',status:'failed',detail:'The command failed before writing its report.'}]}, null, 2))"
          fi
      - name: Run release readiness and preserve report on failure
        continue-on-error: true
        run: |
          set +e
          npm run qa:release > /tmp/osgard-release-readiness.log 2>&1
          code=$?
          echo "Release readiness exit code: $code"
          if [ ! -s release-readiness.json ]; then
            node -e "require('node:fs').writeFileSync('release-readiness.json', JSON.stringify({status:'blocked',checks:[{id:'release-readiness-report',title:'Release readiness did not produce a report',status:'failed'}]}, null, 2))"
          fi
          if [ ! -s production-route-matrix.json ]; then
            node -e "require('node:fs').writeFileSync('production-route-matrix.json', JSON.stringify({schema:'osgard.production-route-matrix.v1',status:'blocked',routes:[{route:'/games/',status:'failed',reason:'Route matrix did not produce a report.'}]}, null, 2))"
          fi
      - name: Build and verify contract-bound release manifest
        continue-on-error: true
        run: |
          set +e
          npm run build && npm run preflight:frontend && npm run release:verify
          code=$?
          echo "Build/manifest verification exit code: $code"
          if [ ! -s release-manifest.json ]; then
            node -e "require('node:fs').writeFileSync('release-manifest.json', JSON.stringify({schema:'osgard.release-manifest.v1',status:'blocked',checks:[{id:'release-manifest',title:'Build or quality-bound manifest verification failed',status:'failed',detail:'Review deterministic build/preflight result.'}]}, null, 2))"
          fi
      - name: Prepare OpenAI advisory review over minimized evidence
        run: node scripts/osgard-ai-release-review.mjs --report release-readiness.json --report osgard-contract-audit.json --report release-manifest.json --report production-route-matrix.json --send-to-openai
      - name: Upload AI review and machine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osgard-ai-release-review
          if-no-files-found: warn
          path: |
            osgard-ai-release-review.json
            release-readiness.json
            osgard-contract-audit.json
            release-manifest.json
            production-route-matrix.json
