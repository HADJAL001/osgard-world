name: OSGARD frontend deploy

# All deploys touch the same live container and rollback paths. Serialize normal and recovery commits.
concurrency:
  group: osgard-frontend-deploy
  cancel-in-progress: false

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "public/skillcred/**"
      - "public/games/**"
      - "services/osgard-commerce-api/src/campaigns.mjs"
      - "services/osgard-commerce-api/src/server.mjs"
      - "services/osgard-commerce-api/test/campaigns.test.mjs"
      - "scripts/game-intermission-sponsor-smoke.mjs"
      - "public/entertainment/**"
      - "public/sitemap.xml"
      - "public/privacy/**"
      - "public/terms/**"
      - "public/support/**"
      - "godot/null-shift/**"
      - "scripts/null-shift-godot-smoke.mjs"
      - "public/games/null-shift-godot/**"
      - ".gitignore"
      - "index.html"
      - "nginx.conf"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "scripts/sync-swarm-assets.mjs"
      - "scripts/frontend-archive-preflight.mjs"
      - "scripts/production-route-matrix.mjs"
      - "scripts/activate-frontend-remote.sh"
      - "scripts/skillcred-page-smoke.mjs"
      - "scripts/time-prototype-smoke.mjs"
      - "scripts/null-shift-premium-smoke.mjs"
      - "scripts/games-portal-smoke.mjs"
      - "scripts/civic-cascade-crisis-smoke.mjs"
      - "scripts/cascade-lab-evidence-integrity-smoke.mjs"
      - "scripts/osgard-play-pwa-smoke.mjs"
      - "docs/27_OSGARD_PLAY_30_RELEASE_IMPROVEMENTS_2026-10-14.md"
      - ".github/workflows/osgard-play-qa.yml"
      - "scripts/entertainment-hub-smoke.mjs"
      - "scripts/player-console-smoke.mjs"
      - "scripts/consented-analytics-queue-smoke.mjs"
      - "scripts/remix-growth-smoke.mjs"
      - "scripts/games-detail-smoke.mjs"
      - "scripts/cascade-lab-experiment-dossier-smoke.mjs"
      - "scripts/cascade-lab-engineering-suite-smoke.mjs"
      - "scripts/cascade-lab-experiment-studio-smoke.mjs"
      - "scripts/cascade-lab-trajectory-xray-smoke.mjs"
      - "scripts/cascade-lab-mission-director-smoke.mjs"
      - "docs/32_CASCADE_LAB_0.22.0_TRAJECTORY_XRAY.md"
      - "scripts/game-detail-runtime-smoke.mjs"
      - "scripts/games-monetization-smoke.mjs"
      - "scripts/game-detail-growth-cta-smoke.mjs"
      - "scripts/ecosystem-integrity-smoke.mjs"
      - "docs/09_OSGARD_GAMES_PLATFORM_AUDIT.md"
      - "docs/04_NULL_SHIFT_GAME_DESIGN.md"
      - "docs/02_IMPERIUM_OF_TIME_GAME_DESIGN.md"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run check
      - run: npm run qa:null-shift
      - name: Smoke-test the OSGARD Games hub
        run: npm run qa:games-portal
      - name: Smoke-test installable OSGARD PLAY and safe offline boundaries
        run: npm run qa:pwa
      - name: Smoke-test the consent-gated sponsored campaign slot
        run: npm run qa:campaign-manager
      - name: Verify premium Entertainment discovery, share and SEO
        run: npm run qa:entertainment
      - name: Smoke-test read-only Games operations diagnostics
        run: npm run qa:games-operations
      - name: Smoke-test Player Lab daily missions, local rewards and backup migration
        run: npm run qa:player-console
      - name: Verify Games minification and gzip integrity
        run: npm run qa:games-assets
      - name: Verify OSGARD SELECT luxury spotlight and social reward guardrails
        run: npm run qa:osgard-select
      - name: Exercise consented analytics queue during offline/online transitions
        run: npm run qa:consented-analytics-queue
      - name: Smoke-test individual game pages and SEO routes
        run: npm run qa:games-detail
      - name: Validate game-to-business links and privacy-safe attribution
        run: npm run qa:game-business-bridge
      - name: Validate CASCADE LAB experiment dossier export
        run: npm run qa:cascade-lab-dossier
      - name: Validate CASCADE LAB controlled Experiment Studio archive
        run: npm run qa:cascade-lab-experiment-studio
      - name: Verify CASCADE LAB trajectory plots, event timeline and privacy boundaries
        run: npm run qa:cascade-lab-trajectory-xray
      - name: Test game session clock and iframe lifecycle trust boundaries
        run: npm run qa:game-detail-runtime
      - name: Verify REMIX growth funnel, attribution and sponsor safety
        run: npm run qa:remix-growth
      - name: Verify ecosystem links, claims, contacts and privacy boundaries
        run: npm run qa:ecosystem

      - name: Validate the Godot game project contract
        run: npm run qa:null-shift-godot
      - name: Cache Godot 4.7.2 and web export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/osgard-godot
            /home/runner/.local/share/godot/export_templates/4.7.2.stable
          key: osgard-godot-4.7.2-web-templates-v1-${{ runner.os }}
      - name: Install official Godot 4.7.2 engine and web templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/osgard-godot "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -L --fail --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/osgard-godot/engine.zip
          unzip -q /tmp/osgard-godot/engine.zip -d /tmp/osgard-godot/
          curl -L --fail --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -o /tmp/osgard-godot/templates.tpz
          mkdir -p /tmp/osgard-godot/unpacked-templates
          unzip -q /tmp/osgard-godot/templates.tpz -d /tmp/osgard-godot/unpacked-templates
          cp -a /tmp/osgard-godot/unpacked-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Verify Godot installation
        run: |
          chmod +x /tmp/osgard-godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/osgard-godot/Godot_v4.7.2-stable_linux.x86_64 --version
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/web_nothreads_release.zip"
      - name: Import and parse the Godot project
        run: /tmp/osgard-godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path godot/null-shift --quit
      - name: Runtime-smoke gameplay state transitions in headless Godot
        run: |
          set -euo pipefail
          timeout 120s /tmp/osgard-godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot/null-shift --script res://tests/runtime_smoke.gd 2>&1 | tee /tmp/null-shift-godot-runtime.log
          ! grep -E 'SCRIPT ERROR:|Parse Error:|RUNTIME_SMOKE_FAILURE:' /tmp/null-shift-godot-runtime.log
      - name: Export Godot Web game
        run: |
          mkdir -p public/games/null-shift-godot
          /tmp/osgard-godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot/null-shift --export-release Web "$GITHUB_WORKSPACE/public/games/null-shift-godot/index.html"
          node scripts/null-shift-godot-smoke.mjs --export-check public/games/null-shift-godot
      - name: Test monetization scenarios and formula bounds
        run: npm run qa:games-model
      - run: npm run build
      - name: Subset self-hosted Inter and minify SkillCred assets
        run: |
          python -m pip install --quiet fonttools brotli
          python -m fontTools.subset dist/skillcred/fonts/InterVariable.woff2 --output-file=/tmp/InterVariable-subset.woff2 --flavor=woff2 --unicodes="U+0020-007E,U+00A0-00FF,U+0400-045F,U+2000-206F,U+2116,U+2190-2199,U+2212,U+2713-2717,U+FEFF,U+FFFD" --layout-features="*" --no-hinting
          test -s /tmp/InterVariable-subset.woff2
          stat -c 'Subset font bytes: %s' /tmp/InterVariable-subset.woff2
          cp /tmp/InterVariable-subset.woff2 dist/skillcred/fonts/InterVariable.woff2
          python -m fontTools.subset dist/skillcred/fonts/JetBrainsMono-Regular.woff2 --output-file=/tmp/JetBrainsMono-subset.woff2 --flavor=woff2 --unicodes="U+0020-007E,U+00A0-00FF,U+2000-206F,U+2116,U+2190-2199,U+2212,U+2713-2717,U+FEFF,U+FFFD" --layout-features="*" --no-hinting
          test -s /tmp/JetBrainsMono-subset.woff2
          cp /tmp/JetBrainsMono-subset.woff2 dist/skillcred/fonts/JetBrainsMono-Regular.woff2
          python -m fontTools.subset dist/skillcred/fonts/InstrumentSerif-Italic.woff2 --output-file=/tmp/InstrumentSerif-subset.woff2 --flavor=woff2 --unicodes="U+0020-007E,U+00A0-00FF,U+2000-206F,U+2116,U+2190-2199,U+2212,U+2713-2717,U+FEFF,U+FFFD" --layout-features="*" --no-hinting
          test -s /tmp/InstrumentSerif-subset.woff2
          cp /tmp/InstrumentSerif-subset.woff2 dist/skillcred/fonts/InstrumentSerif-Italic.woff2
          printf 'Font bytes — Inter: %s; JetBrains Mono: %s; Instrument Serif: %s\\n' "$(wc -c < dist/skillcred/fonts/InterVariable.woff2)" "$(wc -c < dist/skillcred/fonts/JetBrainsMono-Regular.woff2)" "$(wc -c < dist/skillcred/fonts/InstrumentSerif-Italic.woff2)"
          ./node_modules/.bin/esbuild dist/skillcred/app.js --minify --outfile=/tmp/skillcred-app.min.js
          mv /tmp/skillcred-app.min.js dist/skillcred/app.js
          ./node_modules/.bin/esbuild dist/skillcred/styles.css --minify --outfile=/tmp/skillcred-styles.min.css
          mv /tmp/skillcred-styles.min.css dist/skillcred/styles.css
      - run: npm run preflight:frontend
      - run: npm run qa:skillcred
      - name: Verify Imperium of Time visuals and real diagnostics
        run: npm run qa:time-ui
      - name: Check deployment shell syntax
        run: bash -n scripts/activate-frontend-remote.sh
      - name: Package HTML assets and matching Nginx config
        run: |
          mkdir -p osgard-release/html
          cp -a dist/. osgard-release/html/
          ASSET_VERSION="${GITHUB_SHA:0:12}"
          sed -i "s|__OSGARD_BUILD_VERSION__|$ASSET_VERSION|g" osgard-release/html/games/index.html
          grep -Fq "<meta name=\"osgard-build\" content=\"$ASSET_VERSION\">" osgard-release/html/games/index.html
          for asset in luxury.css luxury.js daily-circuit.css daily-circuit.js pwa-install.css pwa-install.js catalog-state.js app.webmanifest; do grep -Fq "$asset?v=$ASSET_VERSION" osgard-release/html/games/index.html || { echo "Missing versioned Games asset: $asset" >&2; exit 1; }; done
          grep -Fq "versioned('/games/'+path)" osgard-release/html/games/index.html || { echo "Missing versioned lazy asset URL builder" >&2; exit 1; }
          grep -Fq "loadScript('player-lifecycle.js')" osgard-release/html/games/index.html || { echo "Missing lazy player lifecycle loader" >&2; exit 1; }
          grep -Fq "loadScript('game-session-recommendations.js')" osgard-release/html/games/index.html || { echo "Missing lazy recommendation loader" >&2; exit 1; }
          grep -Fq "game-session-recommendations.css" osgard-release/html/games/index.html || { echo "Missing lazy recommendation stylesheet path" >&2; exit 1; }
          for asset in player-lifecycle.js game-session-recommendations.js game-session-recommendations.css daily-circuit.js daily-circuit.css pwa-install.css pwa-install.js catalog-state.js app.webmanifest osgard-play-icon.svg offline.html osgard-play-sw.js; do test -s "osgard-release/html/games/$asset" || { echo "Missing Games asset in release archive: $asset" >&2; exit 1; }; done
          sed -i "s|/skillcred/styles.css|/skillcred/styles.css?v=$ASSET_VERSION|g" osgard-release/html/skillcred/index.html
          sed -i "s|/skillcred/app.js|/skillcred/app.js?v=$ASSET_VERSION|g" osgard-release/html/skillcred/index.html
          find osgard-release/html/skillcred -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -exec gzip -9 -k {} +
          SKILLCRED_JS_GZIP_BYTES=$(wc -c < osgard-release/html/skillcred/app.js.gz)
          printf 'SkillCred JavaScript transfer size: %s bytes / 15360 bytes budget\n' "$SKILLCRED_JS_GZIP_BYTES"
          test "$SKILLCRED_JS_GZIP_BYTES" -le 15360 || { echo 'SkillCred compressed JavaScript exceeds 15 KiB budget' >&2; exit 1; }
          touch osgard-release/html/skillcred/styles.css.gz osgard-release/html/skillcred/app.js.gz
          test -s osgard-release/html/skillcred/styles.css.gz
          test -s osgard-release/html/skillcred/app.js.gz
          gzip -t osgard-release/html/skillcred/styles.css.gz osgard-release/html/skillcred/app.js.gz
          cp nginx.conf osgard-release/nginx.conf
          tar -czf osgard-world-release.tgz -C osgard-release .
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.OSGARD_DEPLOY_KEY }}
        run: |
          test -n "$DEPLOY_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/osgard_deploy
          chmod 600 ~/.ssh/osgard_deploy
          ssh-keyscan -H "${{ secrets.OSGARD_DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Stage archive and verify checksum
        env:
          HOST: ${{ secrets.OSGARD_DEPLOY_HOST }}
          USER: ${{ secrets.OSGARD_DEPLOY_USER }}
        run: |
          REMOTE_STAGE="/tmp/osgard-gh-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sha256sum osgard-world-release.tgz | tee local.sha256
          ssh -i ~/.ssh/osgard_deploy "$USER@$HOST" "rm -rf '$REMOTE_STAGE' && mkdir -p '$REMOTE_STAGE'"
          scp -i ~/.ssh/osgard_deploy osgard-world-release.tgz "$USER@$HOST:$REMOTE_STAGE/"
          scp -i ~/.ssh/osgard_deploy local.sha256 "$USER@$HOST:$REMOTE_STAGE/"
          ssh -i ~/.ssh/osgard_deploy "$USER@$HOST" "cd '$REMOTE_STAGE' && sha256sum -c local.sha256"
      - name: Activate verified archive with config rollback
        env:
          HOST: ${{ secrets.OSGARD_DEPLOY_HOST }}
          USER: ${{ secrets.OSGARD_DEPLOY_USER }}
        run: |
          scp -i ~/.ssh/osgard_deploy scripts/activate-frontend-remote.sh "$USER@$HOST:/tmp/activate-frontend-remote.sh"
          REMOTE_STAGE="/tmp/osgard-gh-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i ~/.ssh/osgard_deploy "$USER@$HOST" "docker cp '$REMOTE_STAGE/osgard-world-release.tgz' osgard-world:/tmp/osgard-gh-release.tgz && chmod 700 /tmp/activate-frontend-remote.sh && OSGARD_ARCHIVE=/tmp/osgard-gh-release.tgz OSGARD_CONTAINER=osgard-world /tmp/activate-frontend-remote.sh; status=\$?; rm -rf '$REMOTE_STAGE'; exit \$status"
      - name: Verify published routes and same-origin API proxy
        env:
          OSGARD_BASE_URL: https://osgard.world
          OSGARD_EXPECTED_BUILD: ${{ github.sha }}
          SKILLCRED_EXPECT_CURRENT_DESIGN: "1"
        run: npm run qa:production-routes
      - name: Diagnose API upstream after post-deploy route failure
        if: failure()
        continue-on-error: true
        timeout-minutes: 1
        env:
          HOST: ${{ secrets.OSGARD_DEPLOY_HOST }}
          USER: ${{ secrets.OSGARD_DEPLOY_USER }}
        run: |
          set +e
          timeout 35s ssh -o ConnectTimeout=8 -o ServerAliveInterval=3 -o ServerAliveCountMax=2 -i ~/.ssh/osgard_deploy "$USER@$HOST" '
            echo "=== all containers ==="
            timeout 5s docker ps -a --format "{{.Names}} {{.Status}} {{.Ports}}" || true
            echo "=== available OSGARD images ==="
            timeout 5s docker images --format "{{.Repository}}:{{.Tag}} {{.ID}}" | grep -Ei "osgard|game-api" || true
            echo "=== frontend network ==="
            timeout 5s docker inspect -f "{{.State.Status}} {{json .NetworkSettings.Networks}}" osgard-world || true
            echo "=== game API container ==="
            timeout 5s docker inspect -f "{{.State.Status}} {{json .NetworkSettings.Networks}}" osgard-game-api || true
            echo "=== host listener and API health ==="
            timeout 5s sh -lc "ss -ltnp 2>/dev/null | grep ':4317' || netstat -ltnp 2>/dev/null | grep ':4317' || true"
            timeout 5s curl -i --max-time 4 http://127.0.0.1:4317/health 2>&1 || true
            echo "=== host gateway probe from frontend container ==="
            gateway_values="$(docker inspect -f "{{range .NetworkSettings.Networks}}{{.Gateway}} {{end}}" osgard-world 2>/dev/null || true)"
            gateway="${gateway_values%% *}"
            echo "gateway_candidates=${gateway_values:-<none>}"
            echo "gateway=$gateway"
            if [ -n "$gateway" ]; then
              timeout 6s docker exec osgard-world sh -lc "timeout 4s wget -S -T 3 -O- http://$gateway:4317/health 2>&1 || true" || true
            fi
            echo "=== host firewall diagnostics (read-only) ==="
            timeout 5s sh -lc "iptables -vnL INPUT --line-numbers 2>/dev/null | head -n 50 || true; iptables -vnL DOCKER-USER --line-numbers 2>/dev/null || true; ufw status verbose 2>/dev/null || true" || true
            echo "=== upstream DNS and Nginx errors ==="
            timeout 8s docker exec osgard-world sh -lc "timeout 3s getent hosts osgard-game-api 2>&1 || true; tail -n 60 /var/log/nginx/error.log 2>&1 || true" || true
          '
          echo "API diagnostic step finished (or hit its 35-second deadline)."
      - name: Test real issue, verify and revoke through OSGARD proxy
        env:
          OSGARD_BASE_URL: https://osgard.world
        run: node scripts/skillcred-proxy-smoke.mjs
