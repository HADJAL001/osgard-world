name: OSGARD Games Lighthouse Audit

on:
  workflow_run:
    workflows: ["OSGARD frontend deploy"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify the exact Games release is live before measuring
        env:
          EXPECTED_DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          expected="${EXPECTED_DEPLOY_SHA:0:12}"
          for attempt in $(seq 1 18); do
            # Bypass browser/CDN caches so this check sees the newly activated HTML.
            # Require the exact build, versioned Daily Circuit assets and actual lazy-loader contract; never score stale content.
            cache_buster="__osgard_build_check=$expected-$attempt-$(date +%s%N)"
            page="$(curl -fsSL --max-time 12 -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' "https://osgard.world/games/?$cache_buster" 2>/dev/null || true)"
            # Use Bash substring matching here: grep -q can close the pipe early, making
            # printf fail with SIGPIPE under pipefail even when the expected marker exists.
            if [[ "$page" == *"<meta name=\"osgard-build\" content=\"$expected\">"* &&
                  "$page" == *"luxury.css?v=$expected"* &&
                  "$page" == *"daily-circuit.css?v=$expected"* &&
                  "$page" == *"daily-circuit.js?v=$expected"* &&
                  "$page" == *"versioned('/games/'+path)"* &&
                  "$page" == *"loadScript('player-lifecycle.js')"* &&
                  "$page" == *"loadScript('consented-analytics.js')"* &&
                  "$page" == *"loadScript('experiment-core.js')"* &&
                  "$page" == *"loadScript('experiment-runtime.js')"* &&
                  "$page" != *"consented-analytics.js?v="* &&
                  "$page" != *"experiment-core.js?v="* &&
                  "$page" != *"experiment-runtime.js?v="* ]]; then
              echo "Confirmed deployed Games release $expected"
              exit 0
            fi
            observed="$page"
            observed="${observed#*<meta name=\"osgard-build\" content=\"}"
            observed="${observed%%\"*}"
            echo "Waiting for Games release $expected; observed ${observed:-<missing>} (attempt $attempt/18)"
            sleep 10
          done
          echo "Refusing to score a stale Games release; expected $expected" >&2
          exit 1
      - name: Audit OSGARD Games on mobile
        run: npx --yes lighthouse@12.8.2 https://osgard.world/games/ --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=/tmp/osgard-games-lighthouse-mobile.json --quiet
      - name: Audit OSGARD Games on desktop
        run: npx --yes lighthouse@12.8.2 https://osgard.world/games/ --preset=desktop --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=/tmp/osgard-games-lighthouse-desktop.json --quiet
      - name: Report scores and enforce stable quality guardrails
        run: node scripts/games-lighthouse-report.mjs /tmp/osgard-games-lighthouse-mobile.json /tmp/osgard-games-lighthouse-desktop.json
      - name: Preserve raw Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osgard-games-lighthouse-reports
          path: /tmp/osgard-games-lighthouse-*.json
          if-no-files-found: warn
          retention-days: 14
