name: OSGARD frontend validation

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "scripts/skillcred-page-smoke.mjs"
      - "scripts/time-prototype-smoke.mjs"
      - "scripts/games-platform-smoke.mjs"
      - "src/GamesPlatform.tsx"
      - "src/games-platform.css"
      - "src/LegalPages.tsx"
      - "src/legal.css"
      - "public/osgard-mark.svg"
      - "docs/02_IMPERIUM_OF_TIME_GAME_DESIGN.md"
      - "public/skillcred/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/frontend-check.yml"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osgard-frontend-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check the frontend
        run: npm run check
      - name: Build the production site
        run: npm run build
      - name: Verify live SkillCred page wiring
        run: npm run qa:skillcred
      - name: Verify Imperium of Time game systems and visual diagnostics
        run: npm run qa:time-ui
      - name: Verify OSGARD PLAY catalog, consent and commercial surface
        run: npm run qa:games
      - name: Validate static archive and HTML
        run: npm run preflight:frontend
