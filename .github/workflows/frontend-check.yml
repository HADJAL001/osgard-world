name: OSGARD frontend validation

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "scripts/skillcred-page-smoke.mjs"
      - "scripts/time-prototype-smoke.mjs"
      - "scripts/games-portal-smoke.mjs"
      - "scripts/device-fit-smoke.mjs"
      - "scripts/games-detail-smoke.mjs"
      - "scripts/game-detail-runtime-smoke.mjs"
      - "scripts/entertainment-hub-smoke.mjs"
      - "scripts/osgard-select-growth-smoke.mjs"
      - "scripts/consented-analytics-queue-smoke.mjs"
      - "scripts/activate-frontend-remote.sh"
      - "scripts/games-lighthouse-report.mjs"
      - "scripts/external-project-healthcheck.mjs"
      - "scripts/external-project-healthcheck-smoke.mjs"
      - "scripts/project-intake-smoke.mjs"
      - "scripts/osgard-contract-audit.mjs"
      - "scripts/catalog-state-scale-smoke.mjs"
      - "scripts/osgard-performance-budget.mjs"
      - "scripts/osgard-performance-budget.test.mjs"
      - "scripts/osgard-release-attestation.mjs"
      - "scripts/osgard-release-attestation.test.mjs"
      - "scripts/generate-games-share-cards.mjs"
      - "docs/34_OSGARD_CONTRACT_INTEGRITY_ENGINE_2026-10-14.md"
      - "docs/35_OSGARD_RELEASE_QUALITY_ATTESTATION_2026-10-14.md"
      - "docs/36_OSGARD_SEVEN_LAYER_ENGINEERING_UPGRADE_2026-10-15.md"
      - "docs/OSGARD_CORE_CONTRACT.md"
      - "scripts/production-route-matrix.mjs"
      - "public/sitemap.xml"
      - ".github/workflows/games-lighthouse.yml"
      - "public/games/**"
      - "public/entertainment/**"
      - "capacitor.config.json"
      - "codemagic.yaml"
      - "mobile/**"
      - "scripts/prepare-ios-app.mjs"
      - "scripts/ios-appstore-preflight.mjs"
      - "scripts/ios-release-version.mjs"
      - "scripts/ios-release-tag-preflight.mjs"
      - "scripts/generate-ios-app-icon.mjs"
      - "docs/IOS_APP_STORE_CODEMAGIC_RU.md"
      - "services/osgard-commerce-api/**"
      - "public/games/premium/**"
      - "scripts/premium-store-core.test.mjs"
      - "public/games/commerce-config.json"
      - "services/osgard-commerce-api/src/server.mjs"
      - "godot/null-shift/**"
      - "scripts/null-shift-godot-smoke.mjs"
      - "scripts/null-shift-diagnostics-contract-smoke.mjs"
      - "scripts/osgard-ai-release-review.mjs"
      - "scripts/osgard-ai-release-review.test.mjs"
      - "docs/OSGARD_AI_RELEASE_REVIEW.md"
      - "docs/OSGARD_ENGINEERING_BLUEPRINT_2026_2029.md"
      - ".github/workflows/osgard-ai-release-review.yml"
      - "docs/02_IMPERIUM_OF_TIME_GAME_DESIGN.md"
      - "public/skillcred/**"
      - "public/privacy/**"
      - "scripts/privacy-consent-center-smoke.mjs"
      - "scripts/core-analytics-consent-smoke.mjs"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/frontend-check.yml"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osgard-frontend-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify premium commerce dashboard and checkout safety
        run: npm run qa:premium-store
      - name: Check cross-surface OSGARD product contracts
        run: npm run qa:contracts
      - name: Test static asset performance budgets
        run: npm run qa:performance-budget-tests
      - name: Test build-attestation tamper resistance
        run: npm run qa:release-attestation
      - name: Test OpenAI reviewer offline (no API call)
        run: npm run qa:ai-release-review
      - name: Verify Godot diagnostics fault contract
        run: npm run qa:null-shift-diagnostics-contract
      - name: Validate production activation shell before build and tests
        run: bash -n scripts/activate-frontend-remote.sh
      - name: Type-check the frontend
        run: npm run check
      - name: Verify iOS App Store and Codemagic source configuration
        run: npm run qa:ios-appstore
      - name: Build the production site
        run: npm run build
      - name: Enforce production asset budgets
        run: npm run qa:performance-budget
      - name: Bind build to quality reports
        run: npm run release:attest && npm run release:verify
      - name: Verify live SkillCred page wiring
        run: npm run qa:skillcred
      - name: Verify Imperium of Time game systems and visual diagnostics
        run: npm run qa:time-ui
      - name: Verify OSGARD Games portal and Lighthouse guardrails
        run: npm run qa:games-portal
      - name: Verify OSGARD PLAY 30-check diagnostics
        run: npm run qa:games-diagnostics
      - name: Verify Smart Launch local-only device and accessibility contract
        run: npm run qa:device-fit
      - name: Verify contextual recommendations for all catalogue games
        run: npm run qa:game-recommendations
      - name: Verify premium Entertainment discovery, sharing and SEO
        run: npm run qa:entertainment
      - name: Verify OSGARD SELECT luxury spotlight and share-reward guardrails
        run: npm run qa:osgard-select
      - name: Verify portal-wide analytics consent and revoke semantics
        run: npm run qa:core-analytics-consent
      - name: Test consented analytics offline retry and withdrawal
        run: npm run qa:consented-analytics-queue
      - name: Verify privacy page consent controls and queue withdrawal
        run: npm run qa:privacy-consent
      - name: Verify external-project audit contract (network-free)
        run: npm run qa:external-project-healthcheck
      - name: Validate NULL//SHIFT Godot source contract
        run: npm run qa:null-shift-godot
      - name: Verify game detail pages and SEO
        run: npm run qa:games-detail
      - name: Test game session clock and iframe lifecycle trust boundaries
        run: npm run qa:game-detail-runtime
      - name: Verify monetization scenario formulas
        run: npm run qa:games-model
      - name: Test consent-gated commerce and referral event validation
        run: node --test services/osgard-commerce-api/test/core.test.mjs
      - name: Verify managed OSGARD SELECT promotion configuration and admin controls
        run: npm run qa:owned-promo-config
      - name: Verify partner inventory and enquiry form
        run: npm run qa:partners-page
      - name: Verify ecosystem links, claims, contacts and privacy boundaries
        run: npm run qa:ecosystem
      - name: Verify project intake, attribution and safe API fallback
        run: npm run qa:project-intake
      - name: Validate static archive and HTML
        run: npm run preflight:frontend
      - name: Install pinned Capacitor packages for the iOS bundle smoke test
        run: npm install --no-save --package-lock=false @capacitor/core@8.5.3 @capacitor/cli@8.5.3 @capacitor/ios@8.5.3 @capacitor/share@8.0.1
      - name: Bundle native share support and prepare the iOS web payload
        run: |
          npx vite build --config mobile/vite.config.mjs
          node scripts/prepare-ios-app.mjs --web-only
          node scripts/ios-appstore-preflight.mjs --built-web
