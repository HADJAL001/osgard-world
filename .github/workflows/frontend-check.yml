name: OSGARD frontend validation

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "scripts/skillcred-page-smoke.mjs"
      - "scripts/time-prototype-smoke.mjs"
      - "docs/02_IMPERIUM_OF_TIME_GAME_DESIGN.md"
      - "public/skillcred/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/frontend-check.yml"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osgard-frontend-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check the frontend
        run: npm run check
      - name: Build the production site
        run: npm run build
      - name: Verify live SkillCred page wiring
        run: npm run qa:skillcred
      - name: Verify OSGARD PLAY catalog, game links and consent-gated analytics
        run: npm run qa:games-hub
      - name: Verify NULL SHIFT browser game and WebGL contracts
        run: npm run qa:null-shift
      - name: Verify Godot project and published game routing contract
        run: npm run qa:null-shift-godot
      - name: Syntax-check the production route matrix
        run: node --check scripts/production-route-matrix.mjs
      - name: Verify Imperium of Time game systems and visual diagnostics
        run: npm run qa:time-ui
      - name: Validate static archive and HTML
        run: npm run preflight:frontend
