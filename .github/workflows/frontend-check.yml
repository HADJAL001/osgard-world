name: OSGARD frontend validation

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "scripts/skillcred-page-smoke.mjs"
      - "scripts/time-prototype-smoke.mjs"
      - "scripts/games-portal-smoke.mjs"
      - "scripts/osgard-select-growth-smoke.mjs"
      - "scripts/activate-frontend-remote.sh"
      - "scripts/games-lighthouse-report.mjs"
      - "scripts/external-project-healthcheck.mjs"
      - "scripts/external-project-healthcheck-smoke.mjs"
      - ".github/workflows/games-lighthouse.yml"
      - "public/games/**"
      - "services/osgard-commerce-api/**"
      - "godot/null-shift/**"
      - "scripts/null-shift-godot-smoke.mjs"
      - "docs/02_IMPERIUM_OF_TIME_GAME_DESIGN.md"
      - "public/skillcred/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/frontend-check.yml"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osgard-frontend-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate production activation shell before build and tests
        run: bash -n scripts/activate-frontend-remote.sh
      - name: Type-check the frontend
        run: npm run check
      - name: Build the production site
        run: npm run build
      - name: Verify live SkillCred page wiring
        run: npm run qa:skillcred
      - name: Verify Imperium of Time game systems and visual diagnostics
        run: npm run qa:time-ui
      - name: Verify OSGARD Games portal and Lighthouse guardrails
        run: npm run qa:games-portal
      - name: Verify OSGARD SELECT spotlight, service preferences and social rewards
        run: npm run qa:osgard-select
      - name: Verify external-project audit contract (network-free)
        run: npm run qa:external-project-healthcheck
      - name: Validate NULL//SHIFT Godot source contract
        run: npm run qa:null-shift-godot
      - name: Verify game detail pages and SEO
        run: npm run qa:games-detail
      - name: Verify monetization scenario formulas
        run: npm run qa:games-model
      - name: Test consent-gated commerce and referral event validation
        run: node --test services/osgard-commerce-api/test/core.test.mjs
      - name: Verify partner inventory and enquiry form
        run: npm run qa:partners-page
      - name: Verify ecosystem links, claims, contacts and privacy boundaries
        run: npm run qa:ecosystem
      - name: Validate static archive and HTML
        run: npm run preflight:frontend
