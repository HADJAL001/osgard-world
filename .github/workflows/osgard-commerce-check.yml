name: OSGARD Commerce Checks

on:
  pull_request:
  push:
    branches: [master, codex/osgard-commerce-payments-2026-10-13]

jobs:
  commerce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Domain tests
        working-directory: services/osgard-commerce-api
        run: npm test
      - name: Lead workflow validation smoke
        working-directory: .
        run: npm run qa:lead-workflow
      - name: Syntax checks
        working-directory: services/osgard-commerce-api
        run: npm run check
      - name: Static integration checks
        run: node scripts/commerce-rollout-smoke.mjs
