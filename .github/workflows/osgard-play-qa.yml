name: OSGARD PLAY pull request QA

on:
  push:
    branches:
      - feat/osgard-play-pwa-release-hardening-*
    paths:
      - "public/games/**"
      - "services/osgard-commerce-api/src/core.mjs"
      - "services/osgard-commerce-api/test/core.test.mjs"
      - "services/osgard-commerce-api/src/campaigns.mjs"
      - "services/osgard-commerce-api/src/server.mjs"
      - "services/osgard-commerce-api/src/game-coach.mjs"
      - "services/osgard-commerce-api/test/game-coach.test.mjs"
      - "scripts/game-coach-smoke.mjs"
      - "services/osgard-commerce-api/test/campaigns.test.mjs"
      - "src/GameDetailPage.tsx"
      - "src/GameIntermissionSponsor.tsx"
      - "src/game-intermission-sponsor.css"
      - "scripts/game-intermission-sponsor-smoke.mjs"
      - "scripts/osgard-play-pwa-smoke.mjs"
      - "scripts/games-portal-smoke.mjs"
      - "scripts/cascade-lab-engineering-suite-smoke.mjs"
      - "scripts/cascade-lab-trajectory-xray-smoke.mjs"
      - "scripts/cascade-lab-counterfactual-smoke.mjs"
      - "package.json"
      - ".github/workflows/osgard-play-qa.yml"
  pull_request:
    branches: [master]
    paths:
      - "public/games/**"
      - "services/osgard-commerce-api/src/core.mjs"
      - "services/osgard-commerce-api/test/core.test.mjs"
      - "scripts/osgard-play-pwa-smoke.mjs"
      - "scripts/games-portal-smoke.mjs"
      - "scripts/cascade-lab-engineering-suite-smoke.mjs"
      - "scripts/cascade-lab-trajectory-xray-smoke.mjs"
      - "package.json"
      - ".github/workflows/osgard-play-qa.yml"

permissions:
  contents: read

concurrency:
  group: osgard-play-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  games-quality:
    name: OSGARD PLAY release gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run check
      - name: Test install, shareable catalog state, and offline security boundaries
        run: npm run qa:pwa
      - name: Regress the complete gaming portal
        run: npm run qa:games-portal
      - name: Test CASCADE LAB Engineering OS diagnostics, archive and privacy boundaries
        run: npm run qa:cascade-lab-engineering
      - name: Test CASCADE LAB Trajectory X-Ray traces, comparison and archive safety
        run: npm run qa:cascade-lab-trajectory-xray
      - name: Test CASCADE LAB deterministic counterfactual scenarios and local packs
        run: npm run qa:cascade-lab-counterfactual
      - name: Regress sponsor campaign privacy and server contracts
        run: npm run qa:campaign-manager
      - name: Test the post-session sponsor slot and consent bridge
        run: npm run qa:intermission-sponsor
      - name: Test Commerce API allow-lists and consent gates
        run: node --test services/osgard-commerce-api/test/core.test.mjs
      - name: Test campaign placement, schedule and public projection
        run: node --test services/osgard-commerce-api/test/campaigns.test.mjs
      - name: Test the opt-in OpenAI Game Coach
        run: npm run qa:game-coach
