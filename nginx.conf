# Per-client limits for the public JSON API; authentication and authorization remain enforced by osgard-game-api.
limit_req_zone $binary_remote_addr zone=osgard_player_api:10m rate=15r/s;

server {
  listen 80;
  server_name _;

  if ($host = www.osgard.world) {
    return 301 https://osgard.world$request_uri;
  }

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css text/javascript application/json application/javascript application/xml image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location /skillcred/ {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    try_files $uri $uri/ =404;
  }

  # Canonical Entertainment URL: normalize the no-slash alias and serve the
  # dedicated static catalog explicitly rather than falling through to the SPA.
  location = /entertainment {
    return 301 /entertainment/;
  }

  location = /entertainment/ {
    try_files /entertainment/index.html =404;
  }

  # Legacy route: send previous Imperium links to the current playable entry point.
  location = /games/time-empire {
    return 301 /games/time;
  }

  location = /games/time-empire/ {
    return 301 /games/time;
  }

  # Route player/session/analytics endpoints to the API container instead of the SPA fallback.
  # Protected actions still require their bearer/operator token at the API boundary.
  location ^~ /api/v1/ {
    limit_req zone=osgard_player_api burst=30 nodelay;
    limit_req_status 429;
    client_max_body_size 256k;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $osgard_game_api_host osgard-game-api;
    proxy_pass http://$osgard_game_api_host:4317;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;
  }

  # Same-origin gateway for the separate OSGARD Commerce API.
  # Keep the Node service on the private Docker network; do not publish port 8080 publicly.
  location ^~ /commerce-api/ {
    limit_req zone=osgard_player_api burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $osgard_commerce_api_host osgard-commerce-api;
    rewrite ^/commerce-api/(.*)$ /$1 break;
    proxy_pass http://$osgard_commerce_api_host:8080$uri$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin gateway for the public SkillCred demo API.
  # The browser never supplies an issuer token; Authorization and Cookie are dropped.
  location ^~ /skillcred-api/ {
    resolver 127.0.0.11 valid=300s ipv6=off;
    set $skillcred_api_host skillcred-pilot-api.onrender.com;
    rewrite ^/skillcred-api/(.*)$ /$1 break;
    proxy_pass https://$skillcred_api_host$uri$is_args$args;
    proxy_ssl_server_name on;
    proxy_ssl_name skillcred-pilot-api.onrender.com;
    proxy_set_header Host skillcred-pilot-api.onrender.com;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 20s;
    limit_except GET POST OPTIONS { deny all; }
  }

  location = /skillcred/styles.css {
    alias /usr/share/nginx/html/skillcred/styles.css.gz;
    default_type text/css;
    gzip off;
    add_header Content-Encoding gzip always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location = /skillcred/app.js {
    alias /usr/share/nginx/html/skillcred/app.js.gz;
    default_type application/javascript;
    gzip off;
    add_header Content-Encoding gzip always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location ~* ^/skillcred/(?:styles\.css|app\.js|fonts/(?:InterVariable|InstrumentSerif-Italic|JetBrainsMono-Regular)\.woff2)$ {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/css application/javascript;
    gzip_static on;
  }

  location ~* \.webmanifest$ {
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=3600";
  }

  location /api/remix/ {
    proxy_pass http://remix-api:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Unity WebGL build uses precompressed artifacts. Serve the matching .gz
  # files with the correct content encoding and WebAssembly MIME type.
  location /games/remix/player/Build/ {
    gzip_static on;
    add_header Vary Accept-Encoding always;
    types {
      application/wasm wasm;
      application/javascript js;
      application/octet-stream data;
    }
  }

  # ES modules must use a JavaScript MIME type; some system mime.types files
  # do not map .mjs by default. Module scripts fail closed on text/plain/octet-stream.
  location ~* \\.mjs$ {
    default_type application/javascript;
    gzip_static on;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  location ~* \\.(?:css|js|png|jpg|jpeg|gif|svg|woff2?)$ {
    gzip_static on;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }
}