server {
  listen 80;
  server_name _;

  if ($host = www.osgard.world) {
    return 301 https://osgard.world$request_uri;
  }
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.webmanifest$ {
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=3600";
  }

  location /api/remix/ {
    proxy_pass http://remix-api:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Unity WebGL build uses precompressed artifacts. Serve the matching .gz
  # files with the correct content encoding and WebAssembly MIME type.
  location /games/remix/player/Build/ {
    gzip_static on;
    add_header Vary Accept-Encoding always;
    types {
      application/wasm wasm;
      application/javascript js;
      application/octet-stream data;
    }
  }

  location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }
}
