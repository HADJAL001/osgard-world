workflows:
  osgard_play_ios:
    name: OSGARD PLAY — iOS / TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: OSGARD_PLAY_ASC
    environment:
      xcode: latest
      node: 22
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.osgardworld.play
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: osgard-play-v*
          include: true
    scripts:
      - name: Validate release tag and App Store version
        script: node scripts/ios-release-tag-preflight.mjs
      - name: Install locked web dependencies
        script: npm ci
      - name: Install pinned native build dependencies
        script: |
          npm install --no-save --package-lock=false \
            @capacitor/core@8.5.3 \
            @capacitor/cli@8.5.3 \
            @capacitor/ios@8.5.3 \
            @capacitor/share@8.0.1
      - name: Validate the web application
        script: |
          npm run check
          npm run qa:ios-appstore
          npm run qa:games-portal
          npm run qa:game-coach
          npm run qa:games-detail
          npm run qa:null-shift
          npm run qa:games-model
          npm run qa:osgard-select
          npm run qa:consented-analytics-queue
          npm run qa:ecosystem
      - name: Build all local web game assets
        script: npm run build
      - name: Bundle native iOS sharing bridge
        script: npx vite build --config mobile/vite.config.mjs
      - name: Prepare offline game shell and privacy-aware API configuration
        script: node scripts/prepare-ios-app.mjs --web-only
      - name: Verify iOS App Store and local asset preflight
        script: node scripts/ios-appstore-preflight.mjs --built-web
      - name: Generate the native iOS project
        script: npx cap add ios --packagemanager SPM
      - name: Sync local web assets and native plugins
        script: npx cap sync ios
      - name: Prepare branded app icons, privacy manifest, and build version
        script: node scripts/prepare-ios-app.mjs --ios-project
      - name: Configure automatic App Store signing
        script: xcode-project use-profiles
      - name: Build signed iOS IPA
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App --archive-directory ios/App/build/ios/xcarchive --ipa-directory ios/App/build/ios/ipa
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Deliberately do not auto-submit for public App Store review. First run
        # device checks and finish the App Store listing, privacy labels and age rating.
