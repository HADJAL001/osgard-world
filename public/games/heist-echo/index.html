<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071011"><meta name="robots" content="index,follow">
<meta name="description" content="HEIST//ECHO 4.0 FRONTIER — тактическая песочница с редактором миссий, реактивной охраной и воспроизводимыми операциями.">
<title>HEIST//ECHO 4.0 — FRONTIER</title>
<style>:root{color-scheme:dark;background:#071011;color:#edf8f5;font:16px/1.5 system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 25%,#173535 0,transparent 55%),#071011;padding:24px}main{width:min(520px,100%);border:1px solid #68e3d43d;border-radius:20px;background:#0b1719e8;padding:28px;box-shadow:0 24px 80px #0008}.mark{color:#8df5e4;font:11px ui-monospace,monospace;letter-spacing:.22em}h1{margin:12px 0 6px;font-size:clamp(24px,5vw,36px);letter-spacing:-.04em}p{color:#aac3c1}.track{height:5px;background:#182c2d;border-radius:99px;overflow:hidden;margin:22px 0 10px}.track span{display:block;height:100%;width:0;background:linear-gradient(90deg,#70e8d7,#e3c777);transition:width .2s}small{color:#829e9c}#error{color:#ffb5a4;overflow-wrap:anywhere}</style>
</head><body><main aria-live="polite"><span class="mark">OSGARD PLAY / FRONTIER RELEASE</span><h1>HEIST//ECHO <span style="color:#8df5e4">4.0</span></h1><p id="status">Проверяю целостность и подготавливаю тактическую песочницу…</p><div class="track" aria-hidden="true"><span id="bar"></span></div><small id="step">Защищённая загрузка · локальные данные</small><p id="error" hidden></p><noscript>Для запуска игры необходим JavaScript.</noscript></main>
<script>
(async()=>{const files=Array.from({length:16},(_,i)=>'payload/part-'+String(i+1).padStart(2,'0')+'.txt');const expected='47f97d13dccb679535e3c73123d057a59459a1c5f1e16e4fdd884da67dd14ce2';const $=id=>document.getElementById(id);try{if(!('DecompressionStream'in window)||!crypto.subtle)throw Error('Обнови браузер: необходимы HTTPS, Web Crypto и распаковка gzip.');const parts=await Promise.all(files.map(async(path,i)=>{const r=await fetch(path,{cache:'force-cache',credentials:'same-origin'});if(!r.ok)throw Error('Не удалось загрузить часть '+(i+1));const text=(await r.text()).trim();if(!/^[A-Za-z0-9+/=]+$/.test(text))throw Error('Повреждена часть '+(i+1));$('bar').style.width=Math.round((i+1)/files.length*55)+'%';return text}));const bin=atob(parts.join(''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),b=>b.toString(16).padStart(2,'0')).join('');if(hash!==expected)throw Error('SHA-256 не совпадает — запуск отменён.');$('bar').style.width='72%';const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();if(!html.includes('HEIST//ECHO')||!html.includes('HEISTECHO_FRONTIER')||html.length<500000)throw Error('Содержимое релиза не прошло проверку.');$('bar').style.width='100%';document.open();document.write(html);document.close()}catch(e){$('status').textContent='Не удалось проверить сборку';$('step').textContent='Игра не была запущена';$('error').hidden=false;$('error').textContent=String(e?.message||e)}})();
</script></body></html>
