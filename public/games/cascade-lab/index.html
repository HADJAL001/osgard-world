<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080a0b">
  <meta name="description" content="CASCADE LAB — инженерная физическая головоломка OSGARD PLAY. Строй цепочки механизмов, запускай ядро и исследуй результат.">
  <meta property="og:title" content="CASCADE LAB — Chain Reaction | OSGARD PLAY">
  <meta property="og:description" content="Собери цепочку. Запусти ядро. Изучи движение. Интерактивная физическая головоломка OSGARD.">
  <link rel="canonical" href="https://osgard.world/games/cascade-lab/">
  <link rel="icon" href="/games/favicon.svg" type="image/svg+xml">
  <title>CASCADE LAB — Chain Reaction | OSGARD PLAY</title>
  <style>
    :root{color-scheme:dark;--bg:#080a0b;--ink:#f2f0e8;--muted:#9ca99f;--line:#ffffff22;--cyan:#79eaff;--acid:#d3ff69}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 20%,#1b3435,transparent 55%),var(--bg);color:var(--ink);font:14px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(610px,100%);padding:clamp(22px,5vw,42px);border:1px solid var(--line);background:#0c1112eF;box-shadow:0 35px 100px #0008}
    .mark{display:grid;place-items:center;width:48px;height:48px;margin-bottom:28px;border:1px solid #79eaff75;color:var(--cyan);font:20px Georgia,serif;box-shadow:0 0 32px #79eaff17}
    .eyebrow{color:var(--cyan);font:10px ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:14px 0 12px;font-size:clamp(36px,8vw,58px);font-weight:550;letter-spacing:-.07em;line-height:.95}h1 span{font-family:Georgia,serif;color:#dbc18a;font-weight:400}
    p{color:var(--muted);font-size:13px}progress{width:100%;height:3px;margin:20px 0 8px;accent-color:var(--cyan)}#status{font:10px ui-monospace,monospace;color:#a4b2a8;overflow-wrap:anywhere}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}a,button{min-height:42px;display:inline-flex;align-items:center;justify-content:center;padding:0 14px;border:1px solid var(--line);background:transparent;color:var(--ink);font:11px system-ui,sans-serif;cursor:pointer;text-decoration:none}a.primary{background:var(--acid);border-color:var(--acid);color:#13180d;font-weight:700}
    .error{display:none;margin-top:18px;padding:12px;border-left:2px solid #e5ad7a;background:#e5ad7a0c;color:#e0b78f;font-size:12px}.error.show{display:block}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">CL</div>
  <div class="eyebrow">OSGARD PLAY / FIELD 08</div>
  <h1>CASCADE <span>LAB</span></h1>
  <p>Загружаем исходную игру и её физическую лабораторию. Сохранения останутся в этом браузере.</p>
  <progress id="progress" max="9" value="0" aria-label="Загрузка игры"></progress>
  <div id="status" role="status" aria-live="polite">Подготовка игрового клиента…</div>
  <div class="error" id="error"></div>
  <div class="actions"><a class="primary" href="/games/">Вернуться в каталог игр ↗</a><button id="retry" type="button" hidden>Повторить загрузку</button></div>
</main>
<script>
(()=>{'use strict';
const parts=['payload-01.txt','payload-02.txt','payload-03.txt','payload-04.txt','payload-05.txt','payload-06.txt','payload-07.txt','payload-07b.txt','payload-08.txt'];
const bridgeScript="(()=>{\n'use strict';\nconst send=(state,extra={})=>{try{if(window.parent!==window)window.parent.postMessage({type:'osgard:game-lifecycle',game:'cascade-lab',state,at:Date.now(),...extra},location.origin)}catch{}};\nlet started=false,finished=false;\nconst announceStart=()=>{if(started||finished)return;started=true;send('started',{level:document.querySelector('[data-level].active')?.dataset.level||'0'})};\nconst startControls=['#launchMain','#pauseBtn','#stepOnce'];\nstartControls.forEach(selector=>document.querySelector(selector)?.addEventListener('click',()=>setTimeout(()=>{const mode=(document.querySelector('#modeTag')?.textContent||'').trim().toLowerCase();if(mode==='run'||mode==='paused')announceStart()},0),{passive:true}));\ndocument.querySelector('#game')?.addEventListener('pointerdown',announceStart,{once:true,passive:true});\ndocument.querySelector('#game')?.addEventListener('keydown',announceStart,{once:true});\ndocument.querySelectorAll('[data-tool],[data-level]').forEach(el=>el.addEventListener('click',announceStart,{once:true,passive:true}));\nconst overlay=document.querySelector('#resultOverlay'),title=document.querySelector('#resultTitle');\nif(overlay)new MutationObserver(()=>{if(finished||!overlay.classList.contains('show'))return;finished=true;const heading=(title?.textContent||'').trim();const success=heading==='Поставка выполнена';send('completed',{success,level:document.querySelector('#stageName')?.textContent||'',durationSeconds:Number.parseFloat(document.querySelector('#resultTime')?.textContent||'0')||undefined})}).observe(overlay,{attributes:true,attributeFilter:['class']});\nwindow.addEventListener('error',event=>{if(!event.message)return;send('error',{message:String(event.message).slice(0,180)})});\nwindow.addEventListener('unhandledrejection',event=>{send('error',{message:String(event.reason?.message||event.reason||'Uncaught promise rejection').slice(0,180)})});\n})();";
const $=id=>document.getElementById(id),status=$('status'),progress=$('progress'),error=$('error'),retry=$('retry');
function setStatus(text,n){status.textContent=text;if(Number.isFinite(n))progress.value=n}
function fail(message){error.textContent=message;error.classList.add('show');retry.hidden=false;setStatus('Игра не запущена.');}
async function boot(){
 error.classList.remove('show');retry.hidden=true;progress.value=0;
 try{
  if(typeof DecompressionStream!=='function'||typeof atob!=='function')throw new Error('Этот браузер не поддерживает безопасную распаковку игрового клиента. Обнови браузер или открой игру на компьютере.');
  const chunks=[];
  for(let i=0;i<parts.length;i++){
   setStatus('Загрузка игровых ресурсов… '+(i+1)+' / '+parts.length,i);
   const response=await fetch(new URL(parts[i],location.href),{cache:'force-cache',credentials:'same-origin'});
   if(!response.ok)throw new Error('Не удалось загрузить часть '+parts[i]+' (HTTP '+response.status+'). Проверь подключение и повтори запуск.');
   chunks.push((await response.text()).trim());
  }
  const base64=chunks.join('');
  if(!base64||base64.length%4!==0)throw new Error('Архив игровых данных повреждён: неверная длина. Обнови страницу и повтори запуск.');
  const binary=atob(base64),bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  if(bytes.length<18||bytes[0]!==31||bytes[1]!==139)throw new Error('Архив игры повреждён: заголовок GZIP не совпал.');
  setStatus('Распаковка физической лаборатории…',parts.length);
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  if(!html.includes('id="game"')||!html.includes('id="launchMain"')||!html.includes('CASCADE LAB')||!html.includes('</head>')||!html.includes('</body>'))throw new Error('Распакованный клиент не прошёл проверку целостности.');
  const seo='<meta name="description" content="CASCADE LAB — инженерная физическая головоломка OSGARD PLAY."><meta property="og:title" content="CASCADE LAB — Chain Reaction | OSGARD PLAY"><link rel="canonical" href="https://osgard.world/games/cascade-lab/">';
  html=html.replace('</head>',seo+'</head>').replace('</body>','<script>'+bridgeScript+'<\\/script></body>');
  setStatus('Клиент готов. Открываем лабораторию…',parts.length);
  document.open();document.write(html);document.close();
 }catch(e){fail(e instanceof Error?e.message:'Неизвестная ошибка загрузки.');}
}
retry.addEventListener('click',boot);
boot();
})();
</script>
</body>
</html>
