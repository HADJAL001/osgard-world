<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a0b"><meta name="color-scheme" content="dark"><meta name="robots" content="noindex,nofollow"><title>Проверка оплаты — OSGARD PLAY</title><link rel="icon" href="/games/favicon.svg" type="image/svg+xml"><style>:root{color-scheme:dark;--bg:#080a0b;--ink:#f2f0e8;--muted:#a5aaa1;--line:#ffffff20;--gold:#d5bb82;--lime:#d3ff69}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0,#31382366,transparent 44%),var(--bg);color:var(--ink);font:15px/1.7 system-ui,sans-serif}.panel{width:min(620px,calc(100% - 28px));border:1px solid var(--line);padding:clamp(24px,6vw,52px);background:#111514}small{font:10px ui-monospace,monospace;letter-spacing:.18em;color:var(--lime)}h1{font:clamp(38px,7vw,60px)/1.05 Georgia,serif;font-weight:400;letter-spacing:-.04em}p{color:var(--muted)}#status{color:var(--gold)}a{color:var(--lime);text-underline-offset:4px}.links{display:flex;flex-wrap:wrap;gap:18px;margin-top:30px}</style></head><body><main class="panel"><small>OSGARD PLAY / ORDER STATUS</small><h1>Проверяем результат</h1><p id="status" role="status" aria-live="polite">Запрашиваем подтверждение у платёжного провайдера…</p><p>Возврат на эту страницу сам по себе не является подтверждением оплаты. Ниже показывается только статус, проверенный сервером.</p><div class="links"><a href="/games/">Вернуться к играм</a><a href="/games/premium/">К покупкам</a><a href="mailto:osman.osmanov0099@gmail.com">Нужна помощь?</a></div></main>
<script>
(async()=>{const status=document.getElementById('status');const params=new URLSearchParams(location.search);const sessionId=params.get('session_id')||'';let base='/commerce-api';try{const config=await fetch('/games/commerce-config.json',{cache:'no-store'}).then(r=>r.ok?r.json():{});base=String(config.apiBaseUrl||base).replace(/\/+$/,'');}catch{}if(!/^cs_(test|live)_[A-Za-z0-9]+$/.test(sessionId)){status.textContent='Не найден безопасный идентификатор заказа. Обновите страницу из письма или обратитесь в поддержку.';return;}try{const response=await fetch(base+'/v1/checkout/status?session_id='+encodeURIComponent(sessionId),{cache:'no-store'});const result=await response.json();if(!response.ok)throw new Error(result.message||'STATUS_UNAVAILABLE');if(result.paid===true){status.textContent='Оплата подтверждена платёжным провайдером. Номер заказа: '+String(result.orderId||'подтверждён').slice(0,80)+'.';let consent=false;try{consent=localStorage.getItem('osgard.games.analytics-consent.v1')==='yes';}catch{}if(consent&&sessionStorage.getItem('osgard.purchase.tracked.'+sessionId)!=='yes'){const sid='session_'+(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'abcdefghi');fetch(base+'/v1/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({consent:true,events:[{name:'checkout_paid',sessionId:sid.replace(/[^a-zA-Z0-9_-]/g,''),gameId:'unknown',source:'checkout-success',path:'/games/premium/success/',durationSeconds:0}]})}).catch(()=>{});try{sessionStorage.setItem('osgard.purchase.tracked.'+sessionId,'yes');}catch{}}}else{status.textContent='Платёж пока не подтверждён. Статус: '+String(result.paymentStatus||result.orderStatus||'ожидает подтверждения')+'. Не повторяйте оплату, пока не проверите заказ.';}}catch(error){status.textContent='Сейчас не удалось проверить заказ на сервере. Это не означает, что платёж прошёл или не прошёл. Обратитесь в поддержку с идентификатором сессии.';}})();
</script></body></html>
